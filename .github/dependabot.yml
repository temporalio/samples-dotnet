version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    # The samples pin package versions and a routine bump doesn't change what they
    # demonstrate, so versions are raised by hand when a sample needs a newer package.
    # Security updates are exempt from this limit.
    open-pull-requests-limit: 0
    # With version updates disabled, a group can only ever apply to security updates.
    groups:
      # The Microsoft.Extensions.* packages share release cadence and are bumped
      # together in a single PR.
      microsoft-extensions:
        applies-to: security-updates
        patterns:
          - "Microsoft.Extensions.*"
      # The official xunit packages share release cadence and are bumped
      # together in a single PR.
      xunit:
        applies-to: security-updates
        patterns:
          - "xunit"
          - "xunit.console"
          - "xunit.runner.visualstudio"
      # The Temporalio packages ship together as one SDK release and share a
      # version, so they are bumped together in a single PR.
      temporalio:
        applies-to: security-updates
        patterns:
          - "Temporalio*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14

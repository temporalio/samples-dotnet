name: Continuous Integration
on:
  pull_request:
  push:
    branches:
      - main
      - "releases/*"
permissions:
  contents: read
  actions: write

jobs:
  build-lint-test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-arm]
        include:
          - os: windows-latest
            checkTarget: true
          - os: ubuntu-latest
          - os: ubuntu-arm
            runsOn: ubuntu-24.04-arm64-2-core
    runs-on: ${{ matrix.runsOn || matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Print build information
        run: "echo head_ref: ${{ github.head_ref }}, ref: ${{ github.ref }}, os: ${{ matrix.os }}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build

      - name: Check format
        if: ${{ matrix.checkTarget }}
        run: dotnet format --verify-no-changes

      # Download before parallel tests can inherit a writable CLI handle on Linux.
      - name: Prepare Nexus serialization context CLI
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) platform=linux ;;
            macOS) platform=darwin ;;
            Windows) platform=windows ;;
            *) exit 1 ;;
          esac
          case "$RUNNER_ARCH" in
            X64) architecture=amd64 ;;
            ARM64) architecture=arm64 ;;
            *) exit 1 ;;
          esac
          cli_dir="$RUNNER_TEMP/nexus-serialization-context-cli"
          mkdir -p "$cli_dir"
          curl --retry 3 --retry-connrefused --fail --silent --show-error --location \
            "https://github.com/temporalio/cli/releases/download/v1.9.3-nexus-serialization-context/temporal_cli_1.9.3-nexus-serialization-context_${platform}_${architecture}.tar.gz" |
            tar -xz -C "$cli_dir"
          cli_path="$cli_dir/temporal"
          if [[ "$RUNNER_OS" == Windows ]]; then
            cli_path="$(cygpath -m "$cli_dir/temporal.exe")"
          fi
          echo "TEMPORAL_SERIALIZATION_CONTEXT_CLI=$cli_path" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test --logger "console;verbosity=detailed" --blame-crash -v n

      - name: Upload test failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-fail-${{ matrix.os }}
          path: tests/TestResults

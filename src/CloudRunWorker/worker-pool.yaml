# Cloud Run WorkerPool: a continuously-polling Temporal worker + a Google-Built OpenTelemetry
# Collector sidecar. Render placeholders with `envsubst` (see README) then apply with
# `gcloud run worker-pools replace`.
#
# This sample connects to a Temporal server over TEMPORAL_ADDRESS with no API key / no TLS (e.g. a
# local dev server exposed via an ngrok TCP tunnel). For Temporal Cloud, add a TEMPORAL_API_KEY env
# var sourced from a Secret Manager secretKeyRef (see the Java/Python samples).
apiVersion: run.googleapis.com/v1
kind: WorkerPool
metadata:
  name: "${WORKER_POOL}"
  labels:
    cloud.googleapis.com/location: "${REGION}"
  annotations:
    run.googleapis.com/scalingMode: manual
    run.googleapis.com/manualInstanceCount: "${INSTANCE_COUNT}"
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/container-dependencies: '{"worker":["collector"]}'
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 0
      serviceAccountName: "${SERVICE_ACCOUNT_EMAIL}"
      containers:
        - name: worker
          image: "${WORKER_IMAGE}"
          env:
            - name: TEMPORAL_ADDRESS
              value: "${TEMPORAL_ADDRESS}"
            - name: TEMPORAL_NAMESPACE
              value: "${TEMPORAL_NAMESPACE}"
            - name: TEMPORAL_TASK_QUEUE
              value: "${TEMPORAL_TASK_QUEUE}"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://localhost:4317
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
        - name: collector
          image: us-docker.pkg.dev/cloud-ops-agents-artifacts/google-cloud-opentelemetry-collector/otelcol-google:0.156.0
          args:
            - --config=env:OTELCOL_CONFIG
          env:
            - name: OTELCOL_CONFIG
              valueFrom:
                secretKeyRef:
                  key: "${COLLECTOR_CONFIG_SECRET_VERSION}"
                  name: "${COLLECTOR_CONFIG_SECRET}"
          startupProbe:
            httpGet:
              path: /
              port: 13133
            timeoutSeconds: 1
            periodSeconds: 2
            failureThreshold: 30
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
